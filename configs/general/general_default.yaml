# General settings
name: 'graph-tf-model'      # Warning: 'debug' and 'test' are reserved name that have a special behavior

wandb: 'online'             # online | offline | disabled
gpus: 1                     # Multi-gpu is not implemented on this branch


resume: null            # If resume, path to ckpt file from outputs directory in main directory
test_only: null         # Use absolute path

check_val_every_n_epochs: 2
sample_every_val: 4
val_check_interval: null
samples_to_generate: 8       # We advise to set it to 2 x batch_size maximum
samples_to_save: 8
chains_to_save: 1
log_every_steps: 50
number_chain_steps: 50        # Number of frames in each gif

final_model_samples_to_generate: 100
final_model_samples_to_save: 30
final_model_chains_to_save: 20
#final_model_samples_to_generate: 3
#final_model_samples_to_save: 2
#final_model_chains_to_save: 1

evaluate_all_checkpoints: False

# classifier settings
victim_engine: "hetero_classifier"
net: 'HeteroSAGE'
feat_dim: 64
n_layers: 2

# attacker settings
attack_method: 'minta'    # 'metattack' | 'random' | 'minta' | 'rohe'
perturb_ratio: 0.15 # deprecated, use sub_edge_perturb_ratio and general_edge_perturb_ratio instead
ctrl_nodes_size: 10
sub_edge_perturb_ratio: 0.1
general_edge_perturb_ratio: 0.15

# defender settings
defense_method: 'diffusion'   # 'none' | 'diffusion' | 'jaccard'
purify_steps: 10
jaccard_threshold: 0.01
jaccard_binarize: true
jaccard_remove_self_loops: true

# repeated experiment settings (for main_attack_defend.py)
trial_runs: 10
trial_base_seed: 0
save_trial_csv: true
trial_csv_name: 'attack_defend_per_trial.csv'
summary_csv_name: 'attack_defend_summary.csv'
output_dir: './outputs'
