# General settings
name: 'graph-tf-model'      # Warning: 'debug' and 'test' are reserved name that have a special behavior

wandb: 'online'             # online | offline | disabled
gpus: 1                     # Multi-gpu is not implemented on this branch


resume: null            # If resume, path to ckpt file from outputs directory in main directory
test_only: null         # Use absolute path

check_val_every_n_epochs: 2
sample_every_val: 4
val_check_interval: null
samples_to_generate: 8       # We advise to set it to 2 x batch_size maximum
samples_to_save: 8
chains_to_save: 1
log_every_steps: 50
number_chain_steps: 50        # Number of frames in each gif

final_model_samples_to_generate: 100
final_model_samples_to_save: 30
final_model_chains_to_save: 20
#final_model_samples_to_generate: 3
#final_model_samples_to_save: 2
#final_model_chains_to_save: 1

evaluate_all_checkpoints: False

# classifier settings
victim_engine: "hetero_classifier"
net: 'HeteroSAGE'
feat_dim: 64
n_layers: 2

# attacker settings
attack_method: 'minta'    # 'metattack' | 'random' | 'minta' | 'rohe'
perturb_ratio: 0.15 # deprecated, use sub_edge_perturb_ratio and general_edge_perturb_ratio instead
ctrl_nodes_size: 10
sub_edge_perturb_ratio: 0.9
general_edge_perturb_ratio: 0.15

# defender settings
defense_method: 'diffusion'   # 'none' | 'diffusion' | 'jaccard' | 'gprgae'
purify_steps: 10
use_task_constraint: false
task_classifier_ckpt: null
task_constraint_lambda_max: 0.1
task_constraint_gamma: 2.0
task_constraint_tau: 1.0
task_classifier_hidden_dim: 64
task_classifier_num_layers: 2
task_classifier_dropout: 0.1
task_classifier_use_input_x: false
task_classifier_fusion: 'attention'
task_classifier_lr: 0.001
task_classifier_weight_decay: 0.0001
task_classifier_epochs: 100
task_classifier_patience: 10
task_classifier_output: './outputs/task_classifier.pt'
jaccard_threshold: 0.01
jaccard_binarize: true
jaccard_remove_self_loops: true
gprgae_hidden: 128
gprgae_K: 7
gprgae_dropout_link: 0.0
gprgae_dropout_mlp: 0.7
gprgae_self_loop: false
gprgae_activation: 'elu'
gprgae_concat_activation: 'elu'
gprgae_lr: 0.001
gprgae_weight_decay: 0.0001
gprgae_train_epochs: 100
gprgae_negative_ratio: 1.0
gprgae_purify_steps: 5
gprgae_purify_tol: 0.0001
gprgae_edge_keep_threshold: 0.5
gprgae_batch_decode: true

# repeated experiment settings (for main_attack_defend.py)
trial_runs: 5
trial_base_seed: 0
save_trial_csv: true
trial_csv_name: 'attack_defend_per_trial.csv'
summary_csv_name: 'attack_defend_summary.csv'
output_dir: './outputs'
