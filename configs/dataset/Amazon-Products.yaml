name: 'Amazon-Products'
datadir: 'data/Amazon-Products/Amazon-Products_pyg/'                 # Relative to the moses_dataset.py file
remove_h: null
filter: False
num_parts: 100
keep_hetero: False
target: 'user'
metapaths: [["user", "upu", "user"],["user", "usu", "user"],["user", "uvu", "user"]]

# Node split tuning for train-stage subgraphs only.
# train ratio = 1 - train_node_val_ratio - train_node_test_ratio
train_node_val_ratio: 0.15
train_node_test_ratio: 0.25

# Majority-class downsampling on train_mask of each train-stage subgraph.
rebalance_train_majority: true
train_majority_ratio_cap: 0.75
